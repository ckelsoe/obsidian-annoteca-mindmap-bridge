# OSV-Scanner suppressions. Every entry must document why the advisory is
# accepted and what would let us drop it. Revisit whenever the dependency tree
# changes (a new lockfile may remove the transitive path entirely).
#
# One active suppression, below. The deepmerge advisory left with Jest
# (2026-11-11): Vitest does not use deepmerge. The minimatch advisory is fixed
# through version-keyed `overrides` (`minimatch@9`, `minimatch@10` to 11) for
# every copy but two, which the entry below covers. The braces entry was
# dropped 2026-11-04 (GitHub withdrew GHSA-vfj7-8cjw-p6xm on 2026-10-23). The
# glob advisory is fixed through `overrides` (2026-11-04). The dev-only
# transitive advisories that previously needed one (brace-expansion
# GHSA-mh99-v99m-4gvg and its bypass GHSA-rgw5-rvv9-x895, js-yaml
# GHSA-5p4m-2wfm-xmqj) are FIXED rather than ignored: the package.json
# `overrides` block pins each dependency to a patched version.
#
# Add an [[IgnoredVulns]] entry here only for an advisory with no non-breaking
# fix, and document why and what would let us drop it.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "minimatch: denial of service when a crafted glob pattern is compiled with optimizationLevel 2 or higher. Fixed in 11. Two copies are left. (1) minimatch 8 under eslint-plugin-json-schema-validator 5, which eslint-plugin-obsidianmd 0.4.x pulls in. It cannot go to 11: the plugin calls require('minimatch').default, and 11 has no default export. It goes when eslint-plugin-obsidianmd moves to 0.5 or later, which drops that plugin. (2) minimatch 10 under type-coverage-core, whose range is 6 || 7 || 8 || 9 || 10: npm 10 (the CI npm) does not apply the minimatch@10 override to that range, and a nested override is ruled out. It goes when type-coverage-core accepts 11. Dev-only: both match this repo's own file names; nothing ships in main.js."
